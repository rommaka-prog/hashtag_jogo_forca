<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca Python</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Cabeçalho -->
    <header class="w-full max-w-md text-center py-4">
        <span class="bg-indigo-500/20 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-500/30">Versão Web</span>
        <h1 class="text-3xl font-bold mt-2 tracking-tight">Jogo da Forca</h1>
        <p class="text-slate-400 text-sm">Adivinhe a palavra secreta em Python</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="w-full max-w-md bg-slate-800/60 backdrop-blur-md rounded-2xl p-6 border border-slate-700 shadow-2xl flex flex-col items-center">
        
        <!-- Desenho da Forca (SVG) -->
        <div class="my-4 h-36 flex items-center justify-center">
            <svg height="120" width="120" viewBox="0 0 100 100" class="stroke-indigo-400 fill-none stroke-[3] rounded-lg">
                <!-- Base da forca -->
                <line x1="10" y1="90" x2="90" y2="90" class="stroke-slate-600 stroke-[4]" />
                <line x1="30" y1="90" x2="30" y2="10" class="stroke-slate-600 stroke-[4]" />
                <line x1="30" y1="10" x2="70" y2="10" class="stroke-slate-600 stroke-[4]" />
                <line x1="70" y1="10" x2="70" y2="25" class="stroke-slate-600 stroke-[4]" />

                <!-- Partes do boneco (aparecem conforme as chances diminuem de 4 para 0) -->
                <!-- 3 chances restantes: Cabeça -->
                <circle id="part-3" cx="70" cy="35" r="10" class="transition-all duration-300 opacity-0" />
                <!-- 2 chances restantes: Tronco -->
                <line id="part-2" x1="70" y1="45" x2="70" y2="70" class="transition-all duration-300 opacity-0" />
                <!-- 1 chance restante: Braços -->
                <line id="part-1" x1="70" y1="55" x2="55" y2="65" class="transition-all duration-300 opacity-0" />
                <line id="part-1-b" x1="70" y1="55" x2="85" y2="65" class="transition-all duration-300 opacity-0" />
                <!-- 0 chances: Pernas (Game Over) -->
                <line id="part-0" x1="70" y1="70" x2="55" y2="85" class="transition-all duration-300 opacity-0" />
                <line id="part-0-b" x1="70" y1="70" x2="85" y2="85" class="transition-all duration-300 opacity-0" />
            </svg>
        </div>

        <!-- Palavra Secreta (Letras ou Tracinhos) -->
        <div id="word-container" class="flex gap-2.5 my-6 text-3xl font-bold tracking-widest min-h-[3rem] items-center justify-center">
            <!-- Gerado via JavaScript -->
        </div>

        <!-- Status de Chances -->
        <div class="mb-6 flex items-center gap-2 bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
            <span class="text-slate-400 text-sm">Chances restantes:</span>
            <span id="chances-count" class="text-indigo-400 font-bold text-lg">4</span>
        </div>

        <!-- Teclado Virtual para Celular -->
        <div id="keyboard" class="grid grid-cols-7 gap-2 w-full">
            <!-- Gerado via JS -->
        </div>

        <!-- Mensagem de Vitória / Derrota (Modal Embutido) -->
        <div id="message-box" class="hidden mt-6 w-full text-center p-4 rounded-xl border transition-all">
            <p id="message-text" class="font-bold text-lg mb-3"></p>
            <button onclick="resetGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-95">
                Jogar Novamente
            </button>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-slate-500 text-xs py-4 text-center">
        Criado para rodar no navegador do celular 🚀
    </footer>

    <!-- Lógica do Jogo -->
    <script>
        const palavra = "python";
        let letrasUsuario = [];
        let chances = 4;
        let gameOver = false;

        const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");

        function initGame() {
            letrasUsuario = [];
            chances = 4;
            gameOver = false;
            document.getElementById('message-box').classList.add('hidden');
            document.getElementById('keyboard').classList.remove('pointer-events-none', 'opacity-50');
            renderKeyboard();
            renderGame();
        }

        function renderGame() {
            // Renderizar a palavra
            let wordContainer = document.getElementById('word-container');
            wordContainer.innerHTML = "";
            let ganhou = true;

            for (let letra of palavra) {
                let span = document.createElement('span');
                span.className = "border-b-4 border-indigo-500 pb-1 w-8 text-center uppercase";
                if (letrasUsuario.includes(letra.toLowerCase())) {
                    span.textContent = letra;
                } else {
                    span.textContent = "_";
                    ganhou = false;
                }
                wordContainer.appendChild(span);
            }

            // Atualizar contador de chances
            document.getElementById('chances-count').textContent = chances;

            // Atualizar desenho da forca baseado nas chances (4 down to 0)
            for (let i = 0; i <= 3; i++) {
                let part = document.getElementById(`part-${i}`);
                if (part) {
                    if (chances <= i) {
                        part.classList.remove('opacity-0');
                    } else {
                        part.classList.add('opacity-0');
                    }
                }
                // Partes duplas (braços e pernas)
                let partB = document.getElementById(`part-${i}-b`);
                if (partB) {
                    if (chances <= i) {
                        partB.classList.remove('opacity-0');
                    } else {
                        partB.classList.add('opacity-0');
                    }
                }
            }

            // Verificar fim de jogo
            if (ganhou) {
                endGame(true);
            } else if (chances === 0) {
                endGame(false);
            }
        }

        function renderKeyboard() {
            let keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = "";

            alphabet.forEach(letra => {
                let btn = document.createElement('button');
                btn.textContent = letra.toUpperCase();
                btn.className = "bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded-lg text-sm uppercase transition-all shadow active:scale-95 disabled:opacity-30 disabled:pointer-events-none";
                
                if (letrasUsuario.includes(letra)) {
                    btn.disabled = true;
                    if (palavra.includes(letra)) {
                        btn.classList.add('!bg-emerald-600');
                    } else {
                        btn.classList.add('!bg-rose-600');
                    }
                }

                btn.onclick = () => handleGuess(letra);
                keyboard.appendChild(btn);
            });
        }

        function handleGuess(letra) {
            if (gameOver || letrasUsuario.includes(letra)) return;

            letrasUsuario.push(letra);

            if (!palavra.toLowerCase().includes(letra.toLowerCase())) {
                chances -= 1;
            }

            renderKeyboard();
            renderGame();
        }

        function endGame(venceu) {
            gameOver = true;
            document.getElementById('keyboard').classList.add('pointer-events-none', 'opacity-50');
            
            let msgBox = document.getElementById('message-box');
            let msgText = document.getElementById('message-text');
            msgBox.classList.remove('hidden');

            if (venceu) {
                msgBox.className = "mt-6 w-full text-center p-4 rounded-xl border bg-emerald-950/80 border-emerald-500/50 text-emerald-300 transition-all shadow-lg";
                msgText.textContent = `🎉 Parabéns, você ganhou! A palavra era: ${palavra.toUpperCase()}`;
            } else {
                msgBox.className = "mt-6 w-full text-center p-4 rounded-xl border bg-rose-950/80 border-rose-500/50 text-rose-300 transition-all shadow-lg";
                msgText.textContent = `❌ Você perdeu! A palavra era: ${palavra.toUpperCase()}`;
            }
        }

        // Inicializar ao carregar
        window.onload = initGame;
    </script>
</body>
</html>
